.rl{width:18px;color:var(--mt);font-size:12px;text-align:center}

.seat.oc{background:var(--oc);cursor:not-allowed}
.seat.sel{background:var(--ac);outline:2px solid var(--tx)}
.gap{width:16px}

var S={sec:0,m:null,c:0,d:0,t:3,sel:{}},app=document.getElementById("app");
var days=[0,1,2,3].map(function(i){var d=new Date();d.setDate(d.getDate()+i);return d});
function dn(d,i){return i==0?"Сегодня":i==1?"Завтра":d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})}
function key(){return S.m+"|"+S.c+"|"+S.d+"|"+S.t}
function h(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function rnd(s){var x=h(s);x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}
function ls(){try{return JSON.parse(localStorage.getItem("kb")||"{}")}catch(e){return{}}}
function bk(k){return ls()[k]||[]}
function occ(k,s){return rnd(k+s)<.35||bk(k).indexOf(s)>-1}
function free(k){var n=0;for(var r=0;r<R.length;r++)for(var i=1;i<=N;i++)if(!occ(k,R[r]+i))n++;return n}
function base(r){return r<2?45000:r<6?60000:75000}
function price(s,c){return Math.round(base(R.indexOf(s[0]))*C[c][1]/1000)*1000}
function fm(n){return n.toLocaleString("ru-RU")+" сум"}
function poster(i){var hu=h("p"+i)%360;return"background:linear-gradient(160deg,hsl("+hu+",55%,38%),hsl("+(hu+50)+",60%,18%))"}
var genres=["Все жанры"].concat(M.map(function(m){return m[1]}).filter(function(v,i,a){return a.indexOf(v)==i}));
document.getElementById("g").innerHTML=genres.map(function(g){return"<option>"+g+"</option>"}).join("");
function card(o,n,a){return"<button class='card"+(a?" fall":"")+"' style='--i:"+Math.min(n,36)+";--r:"+((n*29)%30-15)+"deg' onclick='pick("+o.i+")'><div class='poster' style='"+poster(o.i)+"'>"+(P[o.i]?"<img class='pi' src='"+P[o.i]+"' alt='"+o.m[0]+"'>":art(o.i,o.m[1])+"<span class='tt'>"+o.m[0]+"</span>")+"</div><div class='meta'>"+o.m[1]+" · "+o.m[2]+" мин<br>★ "+o.m[3]+"</div></button>"}
function home(a){document.querySelector("header").classList.remove("mv","ld");document.getElementById("tools").style.display="";
 var q=document.getElementById("q").value.toLowerCase(),g=document.getElementById("g").value,n=0,o="";
 var l=M.map(function(m,i){return{m:m,i:i}}).filter(function(x){return(g=="Все жанры"||x.m[1]==g)&&x.m[0].toLowerCase().indexOf(q)>-1});
 function sec(t,arr){return arr.length?"<h2 class='gh'>"+t+" <small class='full'>"+arr.length+"</small></h2><div class='grid'>"+arr.map(function(x){return card(x,n++,a)}).join("")+"</div>":""}
 if(g=="Все жанры"){o=sec("Все фильмы",l);genres.slice(1).forEach(function(gn){o+=sec(gn,l.filter(function(x){return x.m[1]==gn}))})}else o=sec(g,l);
 app.innerHTML=o||"<p class='sub'>Ничего не найдено</p>"}
function pick(i){S.m=i;S.sel={};S.c=[0,1,2,3,4].filter(function(c){return sh(i,c)})[0];S.sec=0;S.d=0;S.t=3;show()}
function sync(){S.sel={};show()}
function show(){document.querySelector("header").classList.add("mv");document.getElementById("tools").style.display="none";var m=M[S.m],k=key(),b=bk(k);
 var o="<button class='x' onclick='S.m=null;home()' aria-label='Закрыть'>✕</button><button class='back' onclick='S.m=null;home()'>← Все фильмы</button><h1 style='font-size:22px'>"+m[0]+"</h1><div class='sub'>"+m[1]+" · "+m[2]+" мин · ★ "+m[3]+"</div>";
 o+="<h2>Кинотеатры, где идёт фильм</h2><div class='chips'>"+C.map(function(c,i){if(!sh(S.m,i))return"<div class='chip off'>"+c[0]+"<small>фильма нет в прокате</small></div>";var f=free(S.m+"|"+i+"|"+S.d+"|"+S.t);return"<div class='chip"+(i==S.c?" on":"")+"' onclick='S.c="+i+";sync()'>"+c[0]+"<small>"+(f?"свободно мест: "+f:"мест нет")+"</small></div>"}).join("")+"</div>";
 o+="<h2>Дата и сеанс</h2><div class='chips'>"+days.map(function(d,i){return"<div class='chip"+(i==S.d?" on":"")+"' onclick='S.d="+i+";sync()'>"+dn(d,i)+"</div>"}).join("")+"</div><div class='chips'>"+T.map(function(t,i){return"<div class='chip"+(i==S.t?" on":"")+"' onclick='S.t="+i+";sync()'>"+t+"</div>"}).join("")+"</div>";
 o+="<h2>Секция зала</h2><div class='chips'>"+SEC.map(function(c,i){return"<div class='chip"+(i==S.sec?" on":"")+"' onclick='S.sec="+i+";show()'>"+c[0]+(i?"<small>"+fm(price(R[c[1]]+"1",S.c))+"</small>":"<small>выбрать любое</small>")+"</div>"}).join("")+"</div><h2>Выберите места</h2><div class='screen'></div><div class='lbl'>ЭКРАН</div><div class='hall'>";
 for(var r=0;r<R.length;r++){o+="<div class='row'><span class='rl'>"+R[r]+"</span>";for(var i=1;i<=N;i++){var s=R[r]+i,oc=occ(k,s),sl=S.sel[s];if(i==6)o+="<span class='gap'></span>";var ds=r<SEC[S.sec][1]||r>SEC[S.sec][2];o+="<button class='seat"+(oc?" oc":"")+(ds&&!oc?" dim":"")+(sl?" sel":"")+"' "+(oc||ds?"disabled":"onclick=\"tg('"+s+"')\"")+" title='"+s+" · "+fm(price(s,S.c))+"'>"+i+"</button>"}o+="<span class='rl'>"+R[r]+"</span></div>"}
